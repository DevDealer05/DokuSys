name: Build Unsigned IPA & Deploy SideStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: macos-14
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Extract version info
        id: info
        run: |
          VERSION=$(grep 'displayVersion' Package.swift | grep -oE '[0-9]+\.[0-9]+' | head -1 || echo '1.0')
          BUILD=$(grep 'bundleVersion' Package.swift | grep -oE '"[0-9]+"' | tr -d '"' | head -1 || echo '1')
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Build with xcodebuild
        run: |
          echo "=== Discovering Package Schemes ==="
          xcodebuild -list -package-path . || true

          echo "=== Building iOS App Bundle ==="
          xcodebuild build \
            -package-path . \
            -scheme DigitalesBuero \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || \
          xcodebuild build \
            -package-path . \
            -scheme AppModule \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || \
          xcodebuild build \
            -package-path . \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        id: package
        run: |
          mkdir -p dist/Payload
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "Discovered .app path: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" dist/Payload/DigitalesBuero.app
            echo "Successfully copied .app to Payload"
          else
            echo "Error: No .app bundle produced by xcodebuild"
            exit 1
          fi

          cd dist && zip -qr ../DigitalesBuero.ipa Payload/
          IPA_SIZE=$(stat -f%z ../DigitalesBuero.ipa 2>/dev/null || stat -c%s ../DigitalesBuero.ipa || echo 0)
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV
          echo "ipa_size=$IPA_SIZE" >> $GITHUB_OUTPUT
          echo "IPA packaged: $IPA_SIZE bytes"

      - name: Generate apps.json
        run: |
          cat > apps.json << EOF
          {
            "name": "Digitales Buero Updates",
            "identifier": "de.kim.DigitalesBuero.repo",
            "apps": [{
              "name": "Digitales Buero",
              "bundleIdentifier": "de.kim.DigitalesBuero",
              "developerName": "Kim",
              "subtitle": "Schulden und Haushalt Manager",
              "version": "${{ steps.info.outputs.version }}",
              "versionDate": "${{ steps.info.outputs.date }}",
              "versionDescription": "Commit ${{ steps.info.outputs.commit }} - Auto-Build via GitHub Actions",
              "downloadURL": "https://DevDealer05.github.io/DokuSys/DigitalesBuero.ipa",
              "localizedDescription": "Digitales Buero - Haushalt, Schulden, Scanner und KI-Assistent.",
              "iconURL": "https://raw.githubusercontent.com/DevDealer05/DokuSys/main/icon.png",
              "tintColor": "6E5BE8",
              "size": $IPA_SIZE,
              "permissions": [
                {"type": "camera", "usageDescription": "Kamera zum Scannen von Briefen und Belegen"}
              ]
            }],
            "news": []
          }
          EOF
          echo "apps.json generated"
          cat apps.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          include_files: |
            DigitalesBuero.ipa
            apps.json
          exclude_files: |
            .build/**
            dist/**
            .swiftpm/**
          commit_message: "deploy: v${{ steps.info.outputs.version }} (${{ steps.info.outputs.commit }})"

      - name: Build Summary
        run: |
          echo "## ✅ Build & Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Version | ${{ steps.info.outputs.version }} (Build ${{ steps.info.outputs.build }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 Commit  | ${{ steps.info.outputs.commit }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 SideStore URL | https://DevDealer05.github.io/DokuSys/apps.json |" >> $GITHUB_STEP_SUMMARY
          echo "| ⬇️ IPA Download  | https://DevDealer05.github.io/DokuSys/DigitalesBuero.ipa |" >> $GITHUB_STEP_SUMMARY
