name: Build Unsigned IPA & Deploy SideStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: macos-14
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Extract version info
        id: info
        run: |
          VERSION=$(grep 'displayVersion' Package.swift | sed -n 's/.*displayVersion: *"\([^"]*\)".*/\1/p' || echo '1.0.1')
          BUILD=$(grep 'bundleVersion' Package.swift | grep -oE '"[0-9]+"' | tr -d '"' | head -1 || echo '2')
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Generate App Icons
        run: |
          chmod +x scripts/generate_icons.sh scripts/package_ipa.sh scripts/generate_apps_json.sh
          ./scripts/generate_icons.sh

      - name: Build with xcodebuild
        run: |
          echo "=== Discovering Schemes ==="
          xcodebuild -list || true

          echo "=== Building iOS App Bundle ==="
          set -o pipefail
          xcodebuild build \
            -scheme DigitalesBuero \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || {
              echo "## ❌ Build Error Log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -E 'error:|fatal:' xcodebuild.log | head -40 >> $GITHUB_STEP_SUMMARY || true
              tail -n 60 xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY

              ERR_PAYLOAD=$(python3 -c "
import json
with open('xcodebuild.log') as f:
    lines = [l for l in f if 'error:' in l or 'fatal error:' in l]
err = ''.join(lines[:20]) if lines else 'See full build log.'
print(json.dumps({'body': '### ❌ Compilation Error:\n```\n' + err + '\n```'}))
" 2>/dev/null || echo '{"body":"Build failed"}')

              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/json" \
                https://api.github.com/repos/${{ github.repository }}/commits/${{ steps.info.outputs.commit }}/comments \
                -d "$ERR_PAYLOAD" || true

              exit 1
            }

      - name: Package IPA
        id: package
        run: |
          ./scripts/package_ipa.sh "${{ steps.info.outputs.version }}" "${{ steps.info.outputs.build }}" "${{ steps.info.outputs.commit }}" "${{ steps.info.outputs.date }}"
          IPA_SIZE=$(stat -f%z DigitalesBuero.ipa 2>/dev/null || stat -c%s DigitalesBuero.ipa || echo 0)
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV
          echo "ipa_size=$IPA_SIZE" >> $GITHUB_OUTPUT

      - name: Generate apps.json
        run: |
          ./scripts/generate_apps_json.sh DigitalesBuero.ipa
          cat apps.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          include_files: |
            DigitalesBuero.ipa
            apps.json
            build_info.json
          exclude_files: |
            .build/**
            dist/**
            .swiftpm/**
          commit_message: "deploy: v${{ steps.info.outputs.version }} (${{ steps.info.outputs.commit }})"

      - name: Build Summary
        run: |
          echo "## ✅ Build & Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Version | ${{ steps.info.outputs.version }} (Build ${{ steps.info.outputs.build }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 Commit  | ${{ steps.info.outputs.commit }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 SideStore URL | https://DevDealer05.github.io/DokuSys/apps.json |" >> $GITHUB_STEP_SUMMARY
          echo "| ⬇️ IPA Download  | https://DevDealer05.github.io/DokuSys/DigitalesBuero.ipa |" >> $GITHUB_STEP_SUMMARY
